<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">African Feminisms Final Programme Report</title>
  <desc id="desc">Abstract purple and gold cover graphic for the African Feminisms programme report.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31104f"/>
      <stop offset="1" stop-color="#7335a1"/>
    </linearGradient>
    <pattern id="lines" width="88" height="88" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M0 0V88" stroke="#fff" stroke-opacity=".08" stroke-width="18"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#lines)"/>
  <circle cx="1350" cy="130" r="310" fill="#f1b24a" opacity=".94"/>
  <circle cx="1390" cy="170" r="190" fill="#31104f" opacity=".35"/>
  <circle cx="190" cy="810" r="270" fill="#cf5d87" opacity=".7"/>
  <path d="M100 185H680" stroke="#f1b24a" stroke-width="14"/>
  <text x="100" y="285" fill="#fff" font-family="Arial, sans-serif" font-size="92" font-weight="700">AFRICAN</text>
  <text x="100" y="390" fill="#fff" font-family="Arial, sans-serif" font-size="92" font-weight="700">FEMINISMS</text>
  <text x="105" y="485" fill="#f1b24a" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="7">RIGHTS · REPRESENTATION · RESOURCES</text>
  <text x="105" y="620" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="600">Final Programme Report</text>
  <text x="105" y="680" fill="#fff" fill-opacity=".85" font-family="Arial, sans-serif" font-size="30">Revised Edition · August 2026</text>
  <text x="105" y="785" fill="#fff" font-family="Arial, sans-serif" font-size="28">Asante-Hoeg Consulting LLC</text>
</svg>
